<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="900" fill="#f7f8fa"/>

  <!-- Encabezado -->
  <text x="60" y="72" font-size="38" font-weight="700" fill="#12233a">Anticipar la falla, no reaccionar a ella</text>
  <text x="60" y="108" font-size="19" fill="#5a6b80">Mantenimiento predictivo de rotativos críticos en una máquina de papel tissue</text>
  <text x="60" y="136" font-size="15" fill="#8593a5">Desempeño medido sobre cinco meses de datos que el modelo nunca vio</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#dde3ea" stroke-width="2"/>

  <!-- Columna izquierda: práctica actual -->
  <rect x="60" y="192" width="510" height="272" rx="10" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <rect x="60" y="192" width="510" height="6" rx="3" fill="#b3bcc7"/>
  <text x="92" y="238" font-size="14" font-weight="700" fill="#8593a5" letter-spacing="1.4">PRÁCTICA ACTUAL</text>
  <text x="92" y="268" font-size="21" font-weight="600" fill="#12233a">Ruta mensual de vibración</text>
  <text x="92" y="295" font-size="15" fill="#5a6b80">Una medición portátil al mes, norma ISO 20816</text>
  <text x="92" y="374" font-size="66" font-weight="700" fill="#98a3b0">0 de 5</text>
  <text x="92" y="404" font-size="16" fill="#5a6b80">fallas con precursor anticipadas</text>
  <text x="92" y="438" font-size="15" fill="#8593a5">Sobre el histórico completo: 1 de 37</text>

  <!-- Columna derecha: modelo -->
  <rect x="630" y="192" width="510" height="272" rx="10" fill="#ffffff" stroke="#c9dcef" stroke-width="2"/>
  <rect x="630" y="192" width="510" height="6" rx="3" fill="#1d6fb8"/>
  <text x="662" y="238" font-size="14" font-weight="700" fill="#1d6fb8" letter-spacing="1.4">MODELO</text>
  <text x="662" y="268" font-size="21" font-weight="600" fill="#12233a">Puntuación diaria de los 12 equipos</text>
  <text x="662" y="295" font-size="15" fill="#5a6b80">Historian, órdenes SAP PM y rutas, cruzados cada día</text>
  <text x="662" y="374" font-size="66" font-weight="700" fill="#1d6fb8">4 de 5</text>
  <text x="662" y="404" font-size="16" fill="#5a6b80">fallas con precursor anticipadas</text>
  <text x="662" y="438" font-size="15" fill="#5a6b80">AUC 0.915  ·  5.5 días de anticipación mediana</text>

  <!-- Nota sobre fallas silenciosas -->
  <rect x="60" y="486" width="1080" height="52" rx="8" fill="#fdf6e7" stroke="#f0e0bb" stroke-width="1.5"/>
  <text x="88" y="510" font-size="15" font-weight="600" fill="#7a5c14">Una de cada cuatro fallas ocurre sin dejar rastro en los sensores.</text>
  <text x="88" y="530" font-size="14.5" fill="#8a6d24">Ninguna técnica puede anticiparlas, así que el desempeño se reporta contra las que sí tenían precursor. Contarlas todas juntas subvendería el sistema.</text>

  <!-- Bloque financiero -->
  <line x1="60" y1="576" x2="1140" y2="576" stroke="#dde3ea" stroke-width="2"/>
  <text x="60" y="612" font-size="15" font-weight="700" fill="#8593a5" letter-spacing="1.4">LO QUE ESTO VALE AL AÑO</text>
  <text x="60" y="638" font-size="14.5" fill="#8593a5">9.4 paradas de emergencia al año en los seis equipos que detienen la máquina completa, contadas sobre 2.55 años de histórico</text>

  <rect x="60" y="658" width="340" height="146" rx="10" fill="#ffffff" stroke="#e8d0cc" stroke-width="2"/>
  <text x="88" y="692" font-size="15" fill="#5a6b80">Se pierde hoy</text>
  <text x="88" y="740" font-size="40" font-weight="700" fill="#c0392b">USD 169.000</text>
  <text x="88" y="768" font-size="14" fill="#8593a5">9.4 paradas × 12 h × USD 1.500</text>
  <text x="88" y="788" font-size="14" fill="#8593a5">la hora de máquina</text>

  <rect x="430" y="658" width="340" height="146" rx="10" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="458" y="692" font-size="15" fill="#5a6b80">Se perdería con el modelo</text>
  <text x="458" y="740" font-size="40" font-weight="700" fill="#7a5c14">USD 79.200</text>
  <text x="458" y="768" font-size="14" fill="#8593a5">6.0 eventos pasan a intervención</text>
  <text x="458" y="788" font-size="14" fill="#8593a5">programada de 2 h</text>

  <rect x="800" y="658" width="340" height="146" rx="10" fill="#12233a"/>
  <text x="828" y="692" font-size="15" fill="#9fb3c8">Ahorro anual</text>
  <text x="828" y="740" font-size="40" font-weight="700" fill="#4fd18b">USD 90.000</text>
  <text x="828" y="768" font-size="14" fill="#9fb3c8">contra USD 3.080 al año de</text>
  <text x="828" y="788" font-size="14" fill="#9fb3c8">operación, nube e inspecciones</text>

  <!-- Cierre -->
  <text x="60" y="842" font-size="17" fill="#12233a">
    <tspan font-weight="700">El sistema se paga en un mes.</tspan>
    <tspan fill="#5a6b80"> Un solo evento anticipado libera USD 15.000, el doble de lo que cuesta construirlo entero.</tspan>
  </text>
  <text x="60" y="872" font-size="13.5" fill="#8593a5">Escenario conservador, con la hora de máquina a USD 1.000 y paradas de 8 h: USD 36.000 al año. Optimista, a USD 2.000 y 18 h: USD 192.000. No se cuenta el costo de la reparación, que ocurre en ambos casos.</text>
</svg>
