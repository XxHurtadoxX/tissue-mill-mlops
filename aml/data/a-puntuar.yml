$schema: https://azuremlschemas.azureedge.net/latest/data.schema.json

name: tissue-a-puntuar
version: 1
type: uri_folder

description: >
  Un día de operación con los doce equipos, listo para que el despliegue por
  lotes lo puntúe. Contiene solo las columnas que el modelo declara en su firma.

  La identidad de cada fila viaja en un archivo aparte. El modelo no ve el
  código del equipo ni la fecha, a propósito, pero hacen falta para leer el
  resultado: una lista de doce probabilidades sin saber a qué máquina
  corresponde cada una no le sirve a nadie.

tags:
  uso: puntuacion_por_lotes

path: ../../workdir/scoring
