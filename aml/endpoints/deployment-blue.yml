$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

name: azul
endpoint_name: tissue-falla-14d

# El modelo está registrado en formato MLflow, así que no hace falta script de
# puntuación ni entorno: Azure los deduce del propio empaquetado, que incluye la
