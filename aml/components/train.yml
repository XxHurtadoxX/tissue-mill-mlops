$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: tissue_train
version: 1
display_name: Entrenar el clasificador
description: >
  Ajusta el modelo con entrenamiento y validación juntos, usando los
  hiperparámetros que encontró la búsqueda.

inputs:
  splits:
    type: uri_folder
  ground_truth:
    type: uri_file
  n_estimators:
    type: integer
    default: 200
  max_features:
    type: string
    default: log2
  min_samples_leaf:
    type: integer
    default: 4

outputs:
  modelo:
    type: uri_folder

code: ../..
command: >-
  python -m src.model.train
  --train ${{inputs.splits}}/train_full
  --valid ${{inputs.splits}}/test
  --ground-truth ${{inputs.ground_truth}}
  --n-estimators ${{inputs.n_estimators}}
  --max-features ${{inputs.max_features}}
  --min-samples-leaf ${{inputs.min_samples_leaf}}
  --output ${{outputs.modelo}}
environment: azureml:tissue-training@latest
