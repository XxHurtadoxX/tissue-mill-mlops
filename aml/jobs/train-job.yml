$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

experiment_name: tissue-falla-14d
display_name: entrenamiento-propio
description: >
  Entrena el clasificador de falla a catorce días con el script del repositorio.
  Reemplaza al modelo de AutoML por uno que se puede inspeccionar, versionar y
  reentrenar, que es lo que el despliegue y el monitoreo necesitan.

# Se sube el repositorio completo para que funcionen los imports relativos
# entre src.model, src.features y src.simulator.
code: ../..

command: >-
  python -m src.model.train
  --train ${{inputs.train}}
  --valid ${{inputs.valid}}
  --ground-truth ${{inputs.ground_truth}}
  --n-estimators 500
  --max-features sqrt
  --min-samples-leaf 1

inputs:
  train:
    type: mltable
    path: azureml:tissue-train-table:2
  valid:
    type: mltable
    path: azureml:tissue-valid-table:2
  ground_truth:
    type: uri_file
    path: azureml:tissue-ground-truth:1

# Entorno propio, declarado en aml/environments/. Se intentó primero con el
# curado sklearn-1.5, y no sirve para la búsqueda de hiperparámetros: ese
# entorno no trae imagen sino un contexto de construcción alojado en
# almacenamiento de Microsoft, y los trabajos hijos de un sweep solo aceptan
# contextos del workspace o de un registro propio.
environment: azureml:tissue-training@latest

compute: azureml:cpu-cluster
