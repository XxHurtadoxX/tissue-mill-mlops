name: CI

# Se ejecuta en cada push a main y en cada pull request contra main.
# En la protección de rama, marca "quality" como required status check para
# que ningún PR se pueda fusionar con el lint o los tests en rojo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El caché de pip viene incorporado en esta acción y se invalida solo
      # cuando cambian los archivos de dependencias.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar herramientas de calidad
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 src tests

      # Cubre tres cosas: la lógica del simulador, las guardas contra fuga de
      # información del pipeline de datos, y la validez de las definiciones YAML
      # de Azure. Estas últimas evitan descubrir en la nube, y pagando cómputo,
      # errores que se ven en milisegundos.
      - name: Tests (pytest)
        run: pytest
