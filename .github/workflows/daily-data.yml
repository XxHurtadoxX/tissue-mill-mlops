name: Extracto diario de planta

# Simula la operación real: la planta genera datos todos los días. Este cron
# genera el "extracto del historian" del día (en UTC) y lo commitea al repo,
# igual que un job de ingesta que corre cada madrugada.
#
# Notas de realismo/GitHub:
#   * El cron usa hora UTC y puede retrasarse unos minutos en horas pico.
#   * GitHub suspende los cron si el repo no tiene actividad en 60 días; basta
#     con volver a habilitarlos desde la pestaña Actions.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC todos los días
  workflow_dispatch:       # permite dispararlo a mano desde la pestaña Actions

# El job necesita permiso de escritura para poder commitear los datos nuevos.
permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar el extracto de hoy (UTC)
        run: python -m src.simulator.generate --date "$(date -u +%F)"

      # La muestra versionada se mantiene en una ventana móvil. Sin esto el
      # repositorio crecería sin límite, y para mostrar que la ingesta funciona
      # basta con los últimos meses: el histórico completo se regenera cuando
      # se necesita, porque el simulador es determinista.
      - name: Podar los extractos más viejos que la ventana
        env:
          RETENCION_DIAS: "120"
        run: |
          corte=$(date -u -d "-${RETENCION_DIAS} days" +%F)
          echo "Conservando extractos desde $corte en adelante."
          podados=0
          for f in data/bronze/historian/*.csv; do
            dia=$(basename "$f" .csv)
            if [[ "$dia" < "$corte" ]]; then
              git rm -q --ignore-unmatch "$f"
              podados=$((podados + 1))
            fi
          done
          for f in data/bronze/produccion/batches_*.csv; do
            dia=$(basename "$f" .csv)
            if [[ "${dia#batches_}" < "$corte" ]]; then
              git rm -q --ignore-unmatch "$f"
              podados=$((podados + 1))
            fi
          done
          echo "Extractos podados: $podados"

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin datos nuevos para commitear."
          else
            git commit -m "data: extracto de planta $(date -u +%F)"
            git push
          fi
