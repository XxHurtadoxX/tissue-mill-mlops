name: Verificar la generación diaria

# Simula la operación de la planta: cada día se genera el extracto del historian
# correspondiente a esa fecha y se comprueba que el simulador sigue produciendo
# datos válidos.
#
# **Por qué ya no se commitea.** Hasta el 5 de agosto de 2026 este workflow
# subía el extracto al repositorio, y el historial conserva más de sesenta de
# esos commits, que es evidencia suficiente del patrón de ingesta continua.
#
# Al proteger la rama principal, ese push quedó bloqueado, y con razón: la regla
# existe para que nada entre sin pasar las verificaciones. Las salidas eran
# guardar un token de larga duración o registrar una aplicación propia, y
# ninguna se justifica para seguir acumulando datos que el simulador regenera
# con un comando.
#
# El extracto se publica como artefacto de la ejecución, así que sigue
# disponible sin tocar la rama.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC todos los días
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-diaria
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar el extracto de hoy (UTC)
        run: python -m src.simulator.generate --date "$(date -u +%F)" --out extracto

      # La generación es determinista: el mismo día y la misma semilla producen
      # el mismo archivo. Si esto falla, alguien cambió el simulador sin darse
      # cuenta de que rompía la reproducibilidad del histórico.
      - name: Comprobar que la generación es reproducible
        run: |
          python -m src.simulator.generate --date "$(date -u +%F)" --out repeticion
          hoy=$(date -u +%F)
          diff "extracto/bronze/historian/$hoy.csv" "repeticion/bronze/historian/$hoy.csv"
          echo "El extracto se reprodujo idéntico."

      - name: Publicar el extracto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: extracto-${{ github.run_id }}
          path: extracto/
          retention-days: 14
